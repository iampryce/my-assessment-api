replicaCount: 1
environment: staging

# Same registry application-ci.yml already pushes to (GitHub Actions variable STAGING_ECR_REPOSITORY_URL,
# itself sourced from the staging Terraform output ecr_repository_url) — not guessed.
image:
  repository: "494472951824.dkr.ecr.us-east-1.amazonaws.com/cashonrails-aws-staging"
  tag: "6a76f5ef464404e4b7ef18f3271cd2c44c0b1262" # overwritten by CI on every deploy; never :latest

config:
  APP_ENV: "staging"

ingress:
  enabled: true
  host: api.staging.cashonrails.rivetrecords.online
  # NLB terminates TLS with an ACM cert now - Let's Encrypt/cert-manager's HTTP-01 challenge was
  # unreliable here (see terraform/aws/modules/acm, terraform/aws/modules/ingress-nginx).
  acmTlsTermination: true
