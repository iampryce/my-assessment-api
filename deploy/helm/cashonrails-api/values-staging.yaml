replicaCount: 1
environment: staging

# Same registry application-ci.yml already pushes to (GitHub Actions variable STAGING_ECR_REPOSITORY_URL,
# itself sourced from the staging Terraform output ecr_repository_url) — not guessed.
image:
  repository: "494472951824.dkr.ecr.us-east-1.amazonaws.com/cashonrails-aws-staging"
  tag: "76f258dd72c6837a34e3a5d5eb36a831e4425a67" # overwritten by CI on every deploy; never :latest

config:
  APP_ENV: "staging"

ingress:
  enabled: true
  clusterIssuer: letsencrypt-staging
  host: api.staging.cashonrails.rivetrecords.online
