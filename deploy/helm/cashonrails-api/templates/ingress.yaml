{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cashonrails-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cashonrails-api.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.acmTlsTermination }}
    # The shared NLB already terminated TLS with an ACM cert - nginx only ever sees plain HTTP
    # here, so it must not try to redirect it back to HTTPS.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    {{- else }}
    cert-manager.io/cluster-issuer: {{ required "ingress.clusterIssuer is required when ingress.enabled is true and ingress.acmTlsTermination is false" .Values.ingress.clusterIssuer }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if not .Values.ingress.acmTlsTermination }}
  tls:
    - hosts:
        - {{ required "ingress.host is required when ingress.enabled is true" .Values.ingress.host }}
      secretName: cashonrails-api-tls
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required when ingress.enabled is true" .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cashonrails-api
                port:
                  number: {{ .Values.service.port }}
{{- end }}
