# Tears down an environment: platform layer first (Argo CD/ingress-nginx/cert-manager/
# observability/ACM/DNS - needs the SSM tunnel, same as platform-addons.yml), then the foundation
# layer (network/ECR/SSM bridge/EKS/RDS - plain AWS resources, no tunnel needed). One
# "terraform destroy" per layer, no -target scoping - destroy handles dependency ordering itself.
#
# Deliberately requires typing the environment name to confirm - this is the one pipeline in this
# repo that deletes real infrastructure, and workflow_dispatch's own confirmation dialog is not
# enough friction for that on its own.

name: Destroy Environment (DANGER)

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Which environment to destroy"
        required: true
        type: choice
        options: [staging, production]
      confirm:
        description: "Type the environment name exactly to confirm (e.g. \"staging\")"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-confirmation:
    name: Validate confirmation input
    runs-on: ubuntu-latest
    steps:
      - name: Confirmation text must match target_environment exactly
        run: |
          if [ "${{ inputs.confirm }}" != "${{ inputs.target_environment }}" ]; then
            echo "::error::Confirmation text '${{ inputs.confirm }}' does not match target_environment '${{ inputs.target_environment }}' - aborting."
            exit 1
          fi

  destroy-platform:
    name: Destroy platform layer
    needs: [validate-confirmation]
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Configure AWS credentials (OIDC, platform-bootstrap role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_PLATFORM_BOOTSTRAP_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install session-manager-plugin
        run: |
          curl -sL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb

      - name: Open SSM tunnel to the private EKS API
        run: |
          TARGET_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Purpose,Values=cicd-ssm-target" "Name=tag:Environment,Values=${{ inputs.target_environment }}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ "$TARGET_ID" = "None" ] || [ -z "$TARGET_ID" ]; then
            echo "No running SSM bridge instance found - node group/bastion may already be torn down. Skipping tunnel; the destroy step below will fail fast per-resource if the cluster is genuinely gone, which is fine."
            echo "TUNNEL_OPENED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          aws ssm start-session \
            --target "$TARGET_ID" \
            --document-name AWS-StartPortForwardingSessionToRemoteHost \
            --parameters "{\"host\":[\"$(aws eks describe-cluster --name cashonrails-aws-${{ inputs.target_environment }} --query 'cluster.endpoint' --output text | sed 's#https://##')\"],\"portNumber\":[\"443\"],\"localPortNumber\":[\"6443\"]}" \
            > /tmp/ssm-session.log 2>&1 &
          echo $! > /tmp/ssm-session.pid
          for i in $(seq 1 15); do (echo > /dev/tcp/127.0.0.1/6443) >/dev/null 2>&1 && break; sleep 1; done
          echo "TUNNEL_OPENED=true" >> "$GITHUB_ENV"

      - name: terraform init
        working-directory: terraform/aws/envs/${{ inputs.target_environment }}/platform
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: terraform destroy
        working-directory: terraform/aws/envs/${{ inputs.target_environment }}/platform
        run: |
          terraform destroy -input=false -auto-approve -lock-timeout=300s \
            -var="acme_email=${{ secrets.ACME_EMAIL }}"

      - name: Close SSM tunnel
        if: always() && env.TUNNEL_OPENED == 'true'
        run: |
          SESSION_ID=$(grep -o '"SessionId": "[^"]*"' /tmp/ssm-session.log | cut -d'"' -f4 || true)
          [ -n "$SESSION_ID" ] && aws ssm terminate-session --session-id "$SESSION_ID" || true
          [ -f /tmp/ssm-session.pid ] && kill "$(cat /tmp/ssm-session.pid)" 2>/dev/null || true

  destroy-foundation:
    name: Destroy foundation layer (network, ECR, SSM bridge, EKS, RDS)
    needs: [destroy-platform]
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Configure AWS credentials (OIDC, apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: terraform init
        working-directory: terraform/aws/envs/${{ inputs.target_environment }}
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      # No -target here (unlike aws-foundation.yml/eks-core.yml's apply-time layering) - destroy
      # handles its own dependency ordering across the whole directory's state in one pass.
      - name: terraform destroy
        working-directory: terraform/aws/envs/${{ inputs.target_environment }}
        run: terraform destroy -input=false -auto-approve -lock-timeout=300s

  summary:
    name: Destroy summary
    needs: [destroy-platform, destroy-foundation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report outcome
        run: |
          echo "Platform layer: ${{ needs.destroy-platform.result }}"
          echo "Foundation layer: ${{ needs.destroy-foundation.result }}"
