name: Terraform Deploy (AWS)

on:
  push:
    branches: [main]
    paths:
      - "infra/aws/**"
      - ".github/workflows/terraform-deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: terraform init
        working-directory: infra/aws/envs/staging
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: terraform plan
        working-directory: infra/aws/envs/staging
        run: terraform plan -input=false -out=tfplan

      - name: terraform apply
        working-directory: infra/aws/envs/staging
        run: terraform apply -input=false -auto-approve tfplan

  production:
    name: Deploy production
    needs: staging
    runs-on: ubuntu-latest
    # The "production" GitHub Environment must have required-reviewer
    # protection configured in the repo's Settings -> Environments. That
    # manual GitHub-side setting — not this workflow file — is what
    # actually enforces "production requires explicit approval": a run
    # reaching this job pauses for reviewer sign-off before anything
    # below executes.
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: terraform init
        working-directory: infra/aws/envs/production
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: terraform plan
        working-directory: infra/aws/envs/production
        run: terraform plan -input=false -out=tfplan

      - name: terraform apply
        working-directory: infra/aws/envs/production
        run: terraform apply -input=false -auto-approve tfplan
