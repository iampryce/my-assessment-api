# Layer: EKS Core - cluster, node group, add-ons, and RDS (RDS depends on EKS's node SG - see final report).
# Depends on: AWS Foundation already applied.

name: EKS Core

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Which environment to plan/apply"
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  check-prerequisites:
    name: Verify AWS Foundation is fully applied
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_APPLY_ROLE_ARN }}
          aws-region: us-east-1
      - name: terraform init
        working-directory: terraform/aws/envs/${{ inputs.target_environment }}
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      # Fails the job (exit 2) if Foundation has pending changes - i.e. hasn't been fully applied.
      - name: terraform plan -detailed-exitcode (network, ECR, SSM target)
        working-directory: terraform/aws/envs/${{ inputs.target_environment }}
        run: |
          terraform plan -input=false -detailed-exitcode \
            -target='module.network' \
            -target='module.ecr' \
            -target='module.cicd_ssm_target'

  plan-and-apply:
    name: Plan + apply (EKS cluster, add-ons, RDS)
    needs: [check-prerequisites]
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: terraform init
        working-directory: terraform/aws/envs/${{ inputs.target_environment }}
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      # Note: this also creates the EKS access entries as a side effect (see final report).
      - name: terraform plan
        working-directory: terraform/aws/envs/${{ inputs.target_environment }}
        run: |
          terraform plan -input=false \
            -target='module.eks' \
            -target='module.rds' \
            -out=tfplan

      - name: terraform apply
        working-directory: terraform/aws/envs/${{ inputs.target_environment }}
        run: terraform apply -input=false -auto-approve tfplan
